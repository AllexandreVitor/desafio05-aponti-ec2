name: CI / CD Pipeline

on:
    push:
        branches:
            - main

jobs:
  # ==========================================
  # FASE 1: SAST e Build
  # Validam a segurança e a estrutura inicial
  # ==========================================
    security-sast:
        name: SAST Security Scan
        runs-on: ubuntu-latest
        steps:
            - name: Checkout Code
              uses: actions/checkout@v5

            - name: Setup Node.js
              uses: actions/setup-node@v5
              with:
                node-version: '24'

            - name: Audith Dependencies
              run: npm audit --audit-level=high || true
    
    build:
        name: Build & Validate Structure
        runs-on: ubuntu-latest
        steps:
            - name: Checkout Code
              uses: actions/checkout@v5

            - name: Setup Node.js
              uses: actions/setup-node@v5
              with:
                node-version: '24'
                cache: "npm"

            - name: Install Dependencies
              run: npm ci

  # ==========================================
  # FASE 2: Lint e Testes Unitários
  # Rodam apenas após a aprovação da Fase 1
  # ==========================================
    lint-quality:
        name: Code Lint & Quality
        runs-on: ubuntu-latest
        needs: [security-sast, build]
        steps:
            - name: Checkout Code
              uses: actions/checkout@v5

            - name: Setup Node.js
              uses: actions/setup-node@v5
              with:
                node-version: '24'
                cache: "npm"

            - name: Install Deendencies
              run: npm ci

            - name: Run ESLint
              run: npm run lint
    
    test:
        name: Unit Tests
        runs-on: ubuntu-latest
        needs: [security-sast, build]
        steps:
            - name: Checkout Code
              uses: actions/checkout@v5

            - name: Setup Node.js
              uses: actions/setup-node@v5
              with:
                node-version: '24'
                cache: "npm"

            - name: Install Dependencies
              run: npm ci

            - name: Run Unit Tests
              run: npm test

  # ==========================================
  # FASE 3: Build & Push To DockerHub
  # ==========================================
    docker:
        name: Build & Push to DockerHub
        needs: [lint-quality, test]
        runs-on: ubuntu-latest
        steps:
            - name: Checkout Source Code
              uses: actions/checkout@v4

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3

            - name: Authenticate to Container Registry
              uses: docker/login-action@v3
              with:
                username: ${{ secrets.DOCKER_API_NODE_LOGIN }}
                password: ${{ secrets.DOCKER_API_NODE_PASSWORD }}

            - name: Build and Push to Docker Hub
              uses: docker/build-push-action@v5
              with:
                context: .
                push: true
                tags: |
                  ${{ secrets.DOCKER_API_NODE_LOGIN }}desafio-05-aponti-ec2:latest
                  ${{ secrets.DOCKER_API_NODE_LOGIN }}desafio-05-aponti-ec2:1.0.${{ github.run_number }}
                  ${{ secrets.DOCKER_API_NODE_LOGIN }}desafio-05-aponti-ec2:${{ github.sha }}
                cache-from: type=gha
                cache-to: type=gha,mode=max
        